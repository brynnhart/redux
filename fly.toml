# fly.toml — Legend of the Red Dragon web port
# Generated for Fly.io deployment

app = "redux"          # replace with your actual fly app name if different
primary_region = "yyz"

[build]
  # Use the Dockerfile in the repo root
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT     = "3000"
  DB_PATH  = "/data/lord.db"

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = true
  auto_start_machines  = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent volume for SQLite database
[[mounts]]
  source      = "redux_data"
  destination = "/data"
  initial_size = "1gb"

[checks]
  [checks.health]
    grace_period = "10s"
    interval     = "30s"
    method       = "GET"
    path         = "/healthz"
    port         = 3000
    timeout      = "5s"
    type         = "http"
