<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web LoRD</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        font-family: "Courier New", monospace;
        background: #03050a;
        color: #7fffd4;
      }
      #screen {
        min-height: 100vh;
        padding: 18px;
        white-space: pre-wrap;
      }
      .title { color: #ffd700; }
      .prompt { color: #ff7aa2; }
      #inputLine {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #prompt {
        color: #ff7aa2;
      }
      #command {
        background: transparent;
        border: none;
        border-bottom: 1px solid #3f4d61;
        color: #a9fff0;
        font-family: inherit;
        width: min(640px, 90vw);
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script>
      const screen = document.getElementById('screen');
      const ws = new WebSocket(`ws://${location.host}/ws`);

      function render(ops) {
        screen.innerHTML = '';
        const content = document.createElement('div');

        let promptText = '> ';

        for (const op of ops) {
          if (op.type === 'clear') {
            content.innerHTML = '';
            continue;
          }
          if (op.type === 'title') {
            const line = document.createElement('div');
            line.className = 'title';
            line.textContent = op.text;
            content.appendChild(line);
            continue;
          }
          if (op.type === 'line') {
            const line = document.createElement('div');
            line.textContent = op.text;
            content.appendChild(line);
            continue;
          }
          if (op.type === 'prompt') {
            promptText = op.text;
          }
        }

        screen.appendChild(content);

        const inputLine = document.createElement('form');
        inputLine.id = 'inputLine';
        const prompt = document.createElement('span');
        prompt.id = 'prompt';
        prompt.textContent = promptText;
        const input = document.createElement('input');
        input.id = 'command';
        input.autocomplete = 'off';
        input.spellcheck = false;

        inputLine.append(prompt, input);
        screen.appendChild(inputLine);
        input.focus();

        inputLine.addEventListener('submit', (event) => {
          event.preventDefault();
          const text = input.value;
          ws.send(JSON.stringify({ type: 'input', text }));
          input.value = '';
        });
      }

      ws.addEventListener('message', (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'screen') {
          render(msg.ops);
        }
      });
    </script>
  </body>
</html>
