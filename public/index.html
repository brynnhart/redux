<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web LoRD</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        background: #03050a;
        color: #c8f5e7;
        font-family: "Courier New", Consolas, monospace;
      }

      #screen {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 16px;
        margin: 0;
        white-space: pre;
        line-height: 1.2;
        font-size: 16px;
        overflow: auto;
        letter-spacing: 0.02em;
        text-shadow: 0 0 4px rgb(150 255 220 / 0.2);
      }

      .tok-color-green { color: #58d68d; }
      .tok-color-red { color: #ff6b6b; }
      .tok-color-yellow { color: #f7dc6f; }
      .tok-color-cyan { color: #7ad8ff; }
      .tok-color-magenta { color: #d88cf8; }
      .tok-color-white { color: #f5f8ff; }
      .tok-color-blue { color: #6ea8ff; }
      .tok-dim { opacity: 0.72; }
      .tok-bold { font-weight: 700; }
    </style>
  </head>
  <body>
    <pre id="screen">Connecting...</pre>
    <script type="module" src="/client.js"></script>
  </body>
</html>
