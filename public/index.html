<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web LoRD</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        background: #03050a;
        color: #c8f5e7;
        font-family: "Courier New", Consolas, monospace;
      }

      #screen {
        position: relative;
        box-sizing: border-box;
        min-height: 100vh;
        padding: 16px;
        margin: 0;
        white-space: pre;
        line-height: 1.2;
        font-size: 16px;
        overflow: auto;
        letter-spacing: 0.02em;
        text-shadow: 0 0 3px rgb(170 255 220 / 0.14), 0 0 8px rgb(255 240 170 / 0.06);
        isolation: isolate;
      }

      body.crt-effects-enabled #screen {
        background: radial-gradient(circle at center, rgb(8 14 12 / 0.34) 0%, rgb(3 5 10 / 0.78) 78%);
        box-shadow: inset 0 0 30px rgb(157 255 214 / 0.04), 0 0 34px rgb(140 230 180 / 0.08);
      }

      body.crt-effects-enabled #screen::before,
      body.crt-effects-enabled #screen::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 1;
      }

      body.crt-effects-enabled #screen::before {
        background: repeating-linear-gradient(
          to bottom,
          rgb(255 255 255 / 0.028) 0,
          rgb(255 255 255 / 0.028) 1px,
          transparent 1px,
          transparent 3px
        );
        mix-blend-mode: soft-light;
      }

      body.crt-effects-enabled #screen::after {
        background:
          radial-gradient(circle at center, transparent 56%, rgb(0 0 0 / 0.18) 100%),
          radial-gradient(circle at 50% 0%, rgb(230 255 200 / 0.05) 0%, transparent 48%),
          linear-gradient(to bottom, rgb(255 255 255 / 0.02), transparent 24%);
      }

      .tok-color-green { color: #58d68d; }
      .tok-color-red { color: #ff6b6b; }
      .tok-color-yellow { color: #f7dc6f; }
      .tok-color-cyan { color: #7ad8ff; }
      .tok-color-magenta { color: #d88cf8; }
      .tok-color-white { color: #f5f8ff; }
      .tok-color-blue { color: #6ea8ff; }
      .tok-dim { opacity: 0.72; }
      .tok-bold { font-weight: 700; }
    </style>
  </head>
  <body>
    <pre id="screen">Connecting...</pre>
    <script type="module" src="/client.js"></script>
  </body>
</html>
